<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dragon Education</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Manrope:wght@400;500;600;700;800&family=Caveat:wght@500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<style>
/* Layout: dark lacquer site in the Instagram style — sticky header, routed pages, catalog grids with filter rail, CRM as a dense work surface */
:root{
  --ink:#0b0f12; --ink-2:#121a1e; --ink-3:#18242a; --ink-4:#203038;
  --teal:#123b3c; --teal-2:#1f5b58;
  --red:#c4262e; --red-2:#e0434a; --blush:#f2c4c0;
  --gold:#d9a94e; --gold-2:#f0cf86;
  --cream:#f3ead8; --soft:#d6cfbf; --muted:#a8a396; --line:rgba(243,234,216,.12); --line-2:rgba(243,234,216,.22);
  --ok:#4fbf8a; --warn:#e3b341; --info:#5aa7e0; --violet:#a98be8; --bad:#e0646a;
  --f-display:"Cormorant Garamond","Times New Roman",Georgia,serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
  --f-han:"Noto Serif SC","Songti SC","SimSun",serif;
  --wrap:1200px; --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--cream);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%;display:block}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:24px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font:700 12px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.eyebrow::before{content:"";width:28px;height:1px;background:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 26px;border-radius:999px;font:700 15px/1 var(--f-body);text-decoration:none;border:1px solid transparent;transition:transform .2s,background .2s,border-color .2s,color .2s;cursor:pointer;background:none;white-space:nowrap}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
.btn-red{background:var(--red);color:#fff;box-shadow:0 10px 30px -12px rgba(196,38,46,.7)}
.btn-red:hover{background:var(--red-2);transform:translateY(-1px)}
.btn-ghost{border-color:rgba(217,169,78,.55);color:var(--gold-2)}
.btn-ghost:hover{background:rgba(217,169,78,.1);border-color:var(--gold)}
.btn-sm{padding:10px 16px;font-size:13px}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(11,15,18,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:22px;height:76px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0;min-width:0}
.brand img{width:50px;height:50px;border-radius:50%;box-shadow:0 0 0 2px rgba(217,169,78,.5)}
.brand b{display:block;font:700 19px/1 var(--f-display);letter-spacing:.08em;color:var(--cream)}
.brand small{display:block;font:600 10px/1.4 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.menu{display:flex;gap:4px;margin-left:auto}
.menu a{text-decoration:none;font-weight:600;font-size:14px;color:var(--muted);padding:8px 11px;border-radius:999px;transition:color .2s,background .2s}
.menu a:hover{color:var(--cream)}
.menu a.on{color:var(--cream);background:var(--ink-3)}
.menu a.crm-link{color:var(--gold-2)}
.burger{display:none;margin-left:auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--ink-2);cursor:pointer;place-items:center}
.burger svg{width:22px;height:22px}
.nav .btn{padding:12px 20px;font-size:14px}
.mnav{display:none;border-top:1px solid var(--line);padding-block:12px 18px}
.mnav a{display:block;padding:11px 4px;text-decoration:none;font-weight:600;color:var(--soft);border-bottom:1px solid var(--line)}
.mnav.open{display:block}

/* Page head */
.phead{padding-block:56px 36px;background:radial-gradient(1200px 300px at 80% -40%,rgba(196,38,46,.18),transparent 70%),linear-gradient(180deg,var(--ink-2),var(--ink));border-bottom:1px solid var(--line)}
.phead h1{font-size:clamp(38px,5vw,62px);margin-top:14px}
.phead p{color:var(--muted);max-width:62ch;margin-top:14px}
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{color:var(--gold-2);text-decoration:none}
.demo-note{display:flex;gap:10px;align-items:flex-start;margin-top:20px;padding:12px 16px;border-radius:12px;background:rgba(227,179,65,.08);border:1px dashed rgba(227,179,65,.4);color:#e9d39a;font-size:13px;max-width:760px}

/* Hero */
.hero{position:relative;overflow:hidden;background:var(--ink)}
.hero-bg{position:absolute;inset:0;background-position:72% 30%;background-size:cover;background-repeat:no-repeat}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--ink) 0%,rgba(11,15,18,.94) 32%,rgba(11,15,18,.55) 52%,rgba(11,15,18,0) 70%),linear-gradient(0deg,var(--ink) 0%,rgba(11,15,18,0) 28%)}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);min-height:620px;align-items:center;padding-block:56px 76px}
.hero-copy{display:flex;flex-direction:column;gap:24px;max-width:620px}
.pill{align-self:flex-start;padding:9px 16px;border-radius:999px;background:rgba(196,38,46,.16);border:1px solid rgba(196,38,46,.45);color:var(--blush);font:800 11.5px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase}
.hero h1{font-size:clamp(40px,5.4vw,70px)}
.hero h1 em{font-style:italic;font-weight:600;color:var(--gold-2)}
.hero h1 .r{color:var(--red-2)}
.lead{font-size:18px;color:var(--soft);max-width:52ch}
.feats{display:flex;flex-wrap:wrap;gap:20px 28px}
.feat{display:flex;align-items:center;gap:12px;font-size:14px;line-height:1.35;font-weight:600}
.feat i{width:42px;height:42px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;background:var(--ink-3);border:1px solid var(--line);color:var(--gold)}
.feat svg{width:20px;height:20px}
.ctas{display:flex;flex-wrap:wrap;gap:14px}
.note{font-size:13px;color:var(--muted)}
.hand{position:absolute;right:4%;top:48px;transform:rotate(-8deg);font:700 34px/1.05 var(--f-hand);color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.45);text-align:right}
.hand small{display:block;font:900 22px/1 var(--f-han);color:var(--gold-2);margin-top:8px;letter-spacing:.1em}
.seal{position:absolute;right:6%;bottom:90px;width:84px;height:84px;border-radius:14px;background:var(--red);color:#fff;display:grid;place-items:center;font:900 44px/1 var(--f-han);transform:rotate(6deg);box-shadow:0 14px 34px -10px rgba(0,0,0,.7);border:3px double rgba(255,255,255,.55)}

/* Sections */
.sec{padding-block:88px}
.sec.tight{padding-top:0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:40px}
.sec-head h2{font-size:clamp(32px,4.2vw,50px);margin-top:14px}
.sec-head p{color:var(--muted);max-width:50ch}
.more{display:inline-flex;gap:8px;align-items:center;color:var(--gold-2);font-weight:700;text-decoration:none;font-size:14px;transition:gap .2s}
.more:hover{gap:12px}
.band{background:var(--ink-2);border-block:1px solid var(--line)}
.band-teal{background:linear-gradient(180deg,var(--ink) 0%,var(--teal) 100%);border-block:1px solid var(--line)}

.about-strip{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:center}
.about-strip h2{font-size:clamp(30px,3.6vw,44px);margin-block:14px 18px}
.about-strip p{color:var(--soft);max-width:58ch}
.checks{display:grid;gap:12px;margin-top:22px;padding:0;list-style:none}
.checks li{display:flex;gap:12px;align-items:flex-start;color:var(--soft)}
.checks li::before{content:"";flex-shrink:0;width:8px;height:8px;margin-top:9px;transform:rotate(45deg);background:var(--gold)}
.quote-card{position:relative;padding:34px;border-radius:22px;background:linear-gradient(150deg,#3a1215,var(--ink-2) 70%);border:1px solid rgba(196,38,46,.45)}
.quote-card .big{font:900 92px/1 var(--f-han);color:rgba(240,207,134,.25);position:absolute;right:20px;top:14px}
.quote-card h3{font-size:30px;margin-bottom:12px;position:relative}
.quote-card p{color:var(--soft);position:relative}

/* Directions */
.dirs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.dir{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:26px 22px 24px;min-height:280px;border-radius:var(--r);background:linear-gradient(160deg,var(--ink-3),var(--ink-2));border:1px solid var(--line);text-decoration:none;transition:transform .25s,border-color .25s}
.dir:hover{transform:translateY(-4px);border-color:rgba(217,169,78,.5)}
.dir .han{position:absolute;right:-8px;bottom:-26px;font:900 140px/1 var(--f-han);color:rgba(217,169,78,.09);pointer-events:none;transition:color .25s}
.dir:hover .han{color:rgba(196,38,46,.2)}
.tag{align-self:flex-start;font:800 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--blush);padding:7px 10px;border-radius:8px;background:rgba(196,38,46,.15)}
.dir h3{font-size:27px;margin-top:4px}
.dir p{color:var(--muted);font-size:14.5px}
.dir .more{margin-top:auto;position:relative}

/* Advantages */
.advs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.adv{background:var(--ink);padding:28px 26px;display:flex;flex-direction:column;gap:10px}
.adv b{font:900 34px/1 var(--f-han);color:var(--gold)}
.adv h3{font-size:24px}
.adv p{color:var(--muted);font-size:14.5px}

/* Process */
.process{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.proc{padding-right:20px}
.proc .num{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.proc .num b{flex-shrink:0;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 var(--f-display);background:var(--ink-3);border:1px solid var(--gold);color:var(--gold-2)}
.proc .num::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.proc:last-child .num::after{display:none}
.proc h3{font-size:22px;margin-bottom:8px}
.proc p{color:var(--muted);font-size:14.5px}

/* Stories */
.stories{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.story{display:flex;flex-direction:column;align-items:center;gap:12px;width:112px;background:none;border:0;padding:0;cursor:pointer;color:var(--cream)}
.ring{width:100px;height:100px;border-radius:50%;padding:3px;background:conic-gradient(from 210deg,var(--red),var(--gold),var(--blush),var(--red));transition:transform .25s}
.story:hover .ring{transform:scale(1.06)}
.ring div{position:relative;width:100%;height:100%;border-radius:50%;border:3px solid var(--ink-2);background:radial-gradient(circle at 50% 35%,#fdeeea,var(--blush));display:grid;place-items:center;overflow:hidden}
.ring img{position:absolute;inset:6%;width:88%;height:88%;border-radius:50%;object-fit:cover;filter:grayscale(1) contrast(1.1);mix-blend-mode:multiply;opacity:.14}
.ring b{position:relative;font:900 34px/1 var(--f-han);color:#b6454b}
.ring b.two{font-size:24px}
.story span{font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-align:center;line-height:1.3}

/* Story viewer */
body.sv-lock{overflow:hidden}
.sv{position:fixed;inset:0;z-index:300;background:rgba(5,7,9,.94);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sv-box{position:relative;width:min(420px,100%);height:min(780px,100%);aspect-ratio:9/16;max-width:100%;border-radius:18px;overflow:hidden;background:var(--ink-2);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.sv-bars{position:absolute;top:10px;left:10px;right:10px;z-index:3;display:flex;gap:4px}
.sv-bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.sv-bars b{display:block;height:100%;background:#fff}
.sv-head{position:absolute;top:22px;left:12px;right:12px;z-index:3;display:flex;align-items:center;gap:10px;color:#fff}
.sv-head img{width:32px;height:32px;border-radius:50%}
.sv-head b{font-size:14px}
.sv-head small{font-size:12px;opacity:.7}
.sv-x{margin-left:auto;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:24px;line-height:1;cursor:pointer}
.sv-media{position:absolute;inset:0}
.sv-photo,.sv-yt{width:100%;height:100%;object-fit:cover;border:0;display:block}
.sv-card{width:100%;height:100%;display:grid;place-items:center}
.sv-g{font:900 min(44vw,190px)/1 var(--f-han);color:rgba(255,255,255,.9);text-shadow:0 10px 40px rgba(0,0,0,.4);margin-bottom:30%}
.sv-nav{position:absolute;top:70px;bottom:120px;width:35%;z-index:2;background:none;border:0;cursor:pointer}
.sv-prev{left:0}.sv-next{right:0}
.sv-cap{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:60px 20px 22px;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);color:#fff;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.sv-cap h3{font-size:28px}
.sv-cap p{font-size:15px;color:#eee;line-height:1.5}


/* Partners */
.partners{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.partner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:18px 10px;border-radius:14px;border:1px solid var(--line);background:var(--ink-2);text-decoration:none;min-height:116px;transition:border-color .2s}
.partner:hover{border-color:var(--gold)}
.partner b{font:900 26px/1 var(--f-han);color:var(--gold-2)}
.partner span{font-size:12.5px;color:var(--soft);line-height:1.3}

/* Covers & cards */
.cover{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;display:grid;place-items:center}
.cover .g{font:900 clamp(64px,9vw,108px)/1 var(--f-han);color:rgba(255,255,255,.88);text-shadow:0 6px 30px rgba(0,0,0,.35)}
.cover .lbl{position:absolute;left:12px;bottom:12px;font:800 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:7px 10px;border-radius:8px;background:rgba(11,15,18,.6);color:var(--cream);backdrop-filter:blur(6px)}
.cover .lbl2{left:auto;right:12px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{display:flex;flex-direction:column;gap:14px;padding:14px 14px 20px;border-radius:var(--r);background:var(--ink-2);border:1px solid var(--line);transition:border-color .2s,transform .2s;min-width:0}
.card:hover{border-color:rgba(217,169,78,.45)}
.card .body{display:flex;flex-direction:column;gap:10px;padding-inline:6px;flex:1}
.card h3{font-size:24px}
.card h3 a{text-decoration:none}
.card .sub{font-size:13.5px;color:var(--muted)}
.card .desc{font-size:14.5px;color:var(--soft)}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--ink-3);border:1px solid var(--line);color:var(--soft);max-width:100%}
.chip.gold{color:var(--gold-2);border-color:rgba(217,169,78,.4)}
.chip.red{color:var(--blush);border-color:rgba(196,38,46,.45);background:rgba(196,38,46,.12)}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.price{font:700 22px/1 var(--f-display);color:var(--gold-2);font-variant-numeric:tabular-nums}
.price small{font:600 12px var(--f-body);color:var(--muted)}

/* Catalog */
.catalog{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
.filters{position:sticky;top:96px;display:flex;flex-direction:column;gap:16px;padding:20px;border-radius:var(--r);background:var(--ink-2);border:1px solid var(--line)}
.filters h4{font:800 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.res-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.empty{padding:48px 24px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--muted)}
.empty b{display:block;font:700 24px var(--f-display);color:var(--cream);margin-bottom:6px}

/* Forms */
label{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;display:flex;flex-direction:column;gap:7px;min-width:0}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--ink-3);color:var(--cream);font:500 15px var(--f-body)}
textarea{resize:vertical;min-height:90px}
input::placeholder,textarea::placeholder{color:#6f6c64}
.req::after{content:" *";color:var(--red-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.formbox{display:flex;flex-direction:column;gap:16px;padding:30px;border-radius:22px;background:var(--ink-2);border:1px solid var(--line)}
.formbox fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
.formbox legend{font:700 22px var(--f-display);color:var(--cream);margin-bottom:12px;padding:0}
.ferr{color:var(--bad);font-size:13px;font-weight:600}
.okbox{padding:28px;border-radius:18px;background:rgba(79,191,138,.08);border:1px solid rgba(79,191,138,.4)}
.okbox h3{font-size:30px;margin-bottom:8px}

/* Detail pages */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:36px;align-items:start}
.detail .main{display:flex;flex-direction:column;gap:30px;min-width:0}
.detail h2{font-size:30px;margin-bottom:12px}
.side{position:sticky;top:96px;display:flex;flex-direction:column;gap:16px;padding:24px;border-radius:var(--r);background:var(--ink-2);border:1px solid var(--line)}
.facts{display:grid;gap:0;margin:0}
.facts div{display:flex;justify-content:space-between;gap:16px;padding-block:11px;border-bottom:1px solid var(--line);font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:right;font-weight:700}
.lst{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.lst li{display:flex;gap:12px;color:var(--soft)}
.lst li::before{content:"";flex-shrink:0;width:7px;height:7px;margin-top:9px;transform:rotate(45deg);background:var(--gold)}
.lst.minus li::before{background:var(--muted);transform:none;height:2px;margin-top:12px;width:9px}
.days{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:d}
.days li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:16px;padding-block:14px;border-bottom:1px solid var(--line);counter-increment:d}
.days li::before{content:"День " counter(d);font:700 13px var(--f-body);color:var(--gold-2);letter-spacing:.04em}
.days.plain li::before{content:"•";font-size:20px;line-height:1}
.days.plain li{grid-template-columns:24px minmax(0,1fr)}
.dates{display:grid;gap:10px}
.date-opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--ink-3);cursor:pointer;text-align:left;width:100%}
.date-opt.on{border-color:var(--gold);background:rgba(217,169,78,.1)}
.date-opt small{color:var(--muted);font-size:12px}
.seats{font-size:12px;font-weight:800;white-space:nowrap}
.seats.low{color:var(--blush)}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}

/* FAQ */
.faq details{border-bottom:1px solid var(--line);padding-block:4px}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:20px;align-items:center;padding-block:16px;font:700 21px/1.25 var(--f-display)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex-shrink:0;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--gold-2);font:400 22px/1 var(--f-body);transition:transform .25s}
.faq details[open] summary::after{transform:rotate(45deg);border-color:var(--gold)}
.faq details p{color:var(--muted);padding-bottom:16px;max-width:66ch}
.faq-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:56px;align-items:start}

/* Contacts */
.contact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.ccard{display:flex;flex-direction:column;gap:8px;padding:24px;border-radius:var(--r);background:var(--ink-2);border:1px solid var(--line)}
.ccard small{color:var(--muted);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ccard b{font-size:20px;font-weight:800;user-select:all;font-variant-numeric:tabular-nums}
.ccard .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.copybtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 12px;font:600 12px/1 var(--f-body);cursor:pointer}
.copybtn:hover{color:var(--cream);border-color:var(--gold)}

/* CTA */
.cta-box{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:32px;flex-wrap:wrap;padding:48px;border-radius:28px;background:linear-gradient(135deg,var(--teal) 0%,#0e2a2b 55%,#2a0d10 100%);border:1px solid rgba(217,169,78,.35)}
.cta-box::before{content:"龙";position:absolute;right:-20px;bottom:-90px;font:900 300px/1 var(--f-han);color:rgba(217,169,78,.07);pointer-events:none}
.cta-box h2{font-size:clamp(30px,3.6vw,46px);margin-top:12px;max-width:18ch}
.cta-box p{color:var(--soft);margin-top:10px;max-width:46ch}
.cta-box .ctas{position:relative}

/* Blog / prose */
.prose{max-width:720px;display:flex;flex-direction:column;gap:16px;color:var(--soft);font-size:17px}
.prose h2{font-size:30px;color:var(--cream);margin-top:14px}
.post-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}

/* Footer */
footer{padding-block:48px 40px;border-top:1px solid var(--line);margin-top:40px}
.fgrid{display:grid;grid-template-columns:1.4fr repeat(3,minmax(0,1fr));gap:32px}
.fgrid h4{font:800 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.fgrid a{display:block;color:var(--muted);text-decoration:none;font-size:14px;padding-block:4px}
.fgrid a:hover{color:var(--cream)}
.fgrid p{color:var(--muted);font-size:14px;margin-top:14px;max-width:36ch}
.socials{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.socials a{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);text-decoration:none;font-weight:700;font-size:13px;color:var(--cream)}
.socials a:hover{border-color:var(--gold)}
.socials svg{width:17px;height:17px}
.copy-r{color:var(--muted);font-size:13px;padding-top:22px;margin-top:30px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.copy-r a{color:var(--muted)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:200;padding:12px 18px;border-radius:12px;background:var(--cream);color:var(--ink);font-weight:700;font-size:14px;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}

/* ================= CRM ================= */
.crm{padding-block:28px 60px}
.crm-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.crm-top h1{font-size:38px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--ink-2);border:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 16px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--ink-4);color:var(--cream)}
.stat-row{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin-bottom:18px}
.stat{display:flex;flex-direction:column;gap:6px;padding:12px 12px;border-radius:12px;background:var(--ink-2);border:1px solid var(--line);cursor:pointer;text-align:left;border-top:3px solid var(--c,var(--muted))}
.stat.on{background:var(--ink-3);border-color:var(--c)}
.stat span{font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.2}
.stat b{font:800 22px/1 var(--f-body);font-variant-numeric:tabular-nums}
.fbar{display:grid;grid-template-columns:2fr repeat(4,minmax(0,1fr)) auto auto;gap:10px;align-items:end;margin-bottom:16px}
.fbar input,.fbar select{padding:10px 12px;font-size:14px}
.fbar label{font-size:11.5px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--ink-2)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:900px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);font-weight:800;white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--ink-3)}
.tbl td .nm{font-weight:800}
.tbl td .sm{font-size:12.5px;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums;white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.who{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.who img,.who .av{width:24px;height:24px;border-radius:50%;flex-shrink:0}
.who .av{display:grid;place-items:center;background:var(--ink-4);font-size:11px;font-weight:800}
.unassigned{color:var(--bad);font-weight:700;font-size:13px}
.gate{max-width:560px;margin:60px auto;text-align:center;padding:40px 28px;border-radius:22px;background:var(--ink-2);border:1px solid var(--line)}
.gate h2{font-size:32px;margin-bottom:10px}
.gate p{color:var(--muted)}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);z-index:100;background:var(--ink);border-left:1px solid var(--line-2);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:20px 24px;border-bottom:1px solid var(--line)}
.dr-head h2{font-size:30px}
.dr-head .sm{color:var(--muted);font-size:13px;margin-top:4px}
.xbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--ink-2);cursor:pointer;flex-shrink:0;font-size:20px;line-height:1}
.dr-body{overflow-y:auto;padding:20px 24px 40px;display:flex;flex-direction:column;gap:22px}
.dr-ctrl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px;border-radius:14px;background:var(--ink-2);border:1px solid var(--line)}
.blk{display:flex;flex-direction:column;gap:12px}
.blk h3{font-size:22px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv label input,.kv label select{padding:9px 11px;font-size:14px}
.subtabs{display:flex;gap:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.subtabs button{border:0;background:none;padding:10px 12px;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button.on{color:var(--cream);border-color:var(--gold)}
.subtabs .n{font-size:11px;color:var(--muted);margin-left:4px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.tl li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted));margin-top:7px}
.tl .t{font-size:14px;color:var(--soft);white-space:pre-wrap;word-break:break-word}
.tl .m{font-size:12px;color:var(--muted);margin-top:2px}
.tl li.comment .t{color:var(--cream)}
.addrow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.addrow > *{flex:1 1 140px}
.addrow .btn{flex:0 0 auto}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;background:var(--ink-2);border:1px solid var(--line);font-size:14px}
.item .grow{flex:1;min-width:0;word-break:break-word}
.item .sm{font-size:12px;color:var(--muted)}
.item input[type=checkbox]{width:18px;height:18px;flex-shrink:0;accent-color:var(--gold)}
.item.done .grow{text-decoration:line-through;color:var(--muted)}
.item .overdue{color:var(--bad);font-weight:800}
.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:8px;font-size:13px}
.icon-btn:hover{color:var(--bad)}
.total{display:flex;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--ink-3);font-weight:800}
.set-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{padding:22px;border-radius:var(--r);background:var(--ink-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.panel h3{font-size:24px}
.panel .hint{color:var(--muted);font-size:13.5px}
.ruleline{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.ruleline > span{font-weight:700;font-size:14px}
.pickers{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1px solid var(--line);background:var(--ink-3);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted)}
.pick.on{border-color:var(--gold);color:var(--gold-2);background:rgba(217,169,78,.1)}
.search-pop{position:relative}
.search-pop .res{position:absolute;left:0;right:0;top:100%;margin-top:6px;z-index:5;background:var(--ink-3);border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
.search-pop .res button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px;cursor:pointer;text-align:left;font-size:14px}
.search-pop .res button:hover{background:var(--ink-4)}
.search-pop .res img{width:24px;height:24px;border-radius:50%}

/* Responsive */
@media (max-width:1100px){
  .menu{display:none}
  .burger{display:grid}
  .nav .btn-head{display:none}
  .dirs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .process{grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}
  .proc .num::after{display:none}
  .partners{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat-row{grid-template-columns:repeat(4,minmax(0,1fr))}
  .fbar{grid-template-columns:repeat(3,minmax(0,1fr))}
  .fbar .q{grid-column:1/-1}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .hero-bg{position:relative;height:360px;background-position:80% 30%}
  .hero-bg::after{background:linear-gradient(0deg,var(--ink) 0%,rgba(11,15,18,0) 45%)}
  .hero-in{grid-template-columns:1fr;min-height:0;padding-block:0 60px;margin-top:-40px}
  .hand{top:24px;font-size:26px}.hand small{font-size:17px}
  .seal{display:none}
  .cards,.post-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .catalog,.detail,.faq-grid,.about-strip,.set-grid{grid-template-columns:1fr}
  .filters,.side{position:static}
  .advs{grid-template-columns:1fr}
  .contact-grid{grid-template-columns:1fr}
  .cta-box{padding:32px 22px}
  .sec{padding-block:64px}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  .wrap{padding-inline:16px}
  .nav{gap:10px;height:66px}
  .brand img{width:40px;height:40px}
  .brand b{font-size:15px}.brand small{display:none}
  .cards.two,.dirs,.process,.cards,.post-list,.grid2,.grid3,.cols2,.kv,.dr-ctrl{grid-template-columns:1fr}
  .partners{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ctas .btn{width:100%}
  .stories{gap:16px}
  .story{width:90px}.ring{width:82px;height:82px}.ring div{font-size:10px}
  .formbox{padding:20px}
  .stat-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fbar{grid-template-columns:1fr 1fr}
  .fgrid{grid-template-columns:1fr}
  .ruleline{grid-template-columns:1fr}
  .dr-head,.dr-body{padding-inline:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}


/* Photograph covers for the six story highlights */

.story .ring div{background:#4a4544;border:3px solid var(--ink-2)}
.story .ring img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;border-radius:50%;filter:none;mix-blend-mode:normal;opacity:1;z-index:1;transition:transform .3s}
.story:hover .ring img{transform:scale(1.08)}
.story .ring b{position:relative;z-index:0}


/* Full-height photo stories with legible captions */
.sv-media{background:linear-gradient(150deg,#665451,#36504d)}
.sv-media::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(20,26,29,.63),transparent 23%,transparent 46%,rgba(20,26,29,.3))}
.sv-photo{position:relative;z-index:1;filter:saturate(.9)}
.sv-fallback{position:absolute;inset:0;display:grid;place-items:center;font:700 140px var(--f-han);color:#ebd1ac33}
.sv-cap{padding:85px 25px 26px;background:linear-gradient(0deg,rgba(24,29,32,.97),rgba(24,29,32,.88) 62%,transparent);gap:12px}
.sv-cap h3{font-size:33px;line-height:1.08;color:#fff0dc}.sv-cap p{font-size:14px;line-height:1.65;color:#eee7de}
.sv-photo-note{font-size:9px;letter-spacing:.04em;color:#d5cfc5}
.sv-head{padding:4px}.sv-head small{font-size:10px}.sv-cap .btn{margin-top:3px}
@media(max-width:480px){.sv-cap{padding-inline:21px}.sv-cap h3{font-size:30px}}
@media(max-height:600px){.sv-cap{padding:45px 20px 14px;gap:7px}.sv-cap h3{font-size:24px}.sv-cap p{font-size:12px}.sv-head small{display:none}}

  if (band === '3to5') return p >= 3000 && p <= 5000;

    <p class="note">Текст подготовлен как шаблон. Перед публикацией рекомендуем согласовать его с юристом.</p></div></div></section>`;
}
function pTerms() {
  return phead('<span>Пользовательские условия</span>', 'Пользовательские условия', 'Правила использования сайта Dragon Education.') + `<section class="sec" style="padding-top:40px"><div class="wrap"><div class="prose">
    <h2>1. Общие положения</h2><p>Сайт носит информационный характер. Описания программ, университетов, туров и лагерей не являются публичной офертой.</p>
    <h2>2. Стоимость и условия</h2><p>Цены, даты и дедлайны указаны ориентировочно и могут меняться университетами и партнёрами. Окончательные условия фиксируются в договоре.</p>
    <h2>3. Поступление и стипендии</h2><p>Решение о зачислении и стипендии принимает университет или стипендиальная организация. Мы помогаем подготовить и подать документы, но не можем гарантировать решение.</p>
    <h2>4. Бронирование туров и лагерей</h2><p>Заявка на сайте не является бронированием. Место закрепляется после подтверждения менеджером и оплаты по договору.</p>
    <h2>5. Контакты</h2><p>По всем вопросам: WhatsApp ${CONTACTS.waKz}, ${CONTACTS.waCn}.</p>
    <p class="note">Текст подготовлен как шаблон. Перед публикацией рекомендуем согласовать его с юристом.</p></div></div></section>`;
}
function notFound() { return phead('<span>404</span>', 'Страница не найдена', 'Возможно, она была перемещена.') + `<section class="sec"><div class="wrap"><a class="btn btn-red" href="#home">На главную</a></div></section>`; }

/* --- Apply form --- */
const SOURCES = ['Сайт', 'Instagram', 'WhatsApp', 'Звонок', 'Рекомендация', 'Threads', 'Выставка / мероприятие', 'Другое'];
const HEARD = ['Instagram', 'Рекомендация друзей', 'Поиск в интернете', 'WhatsApp', 'Threads', 'Другое'];
function pApply() {
  const a = S.apply || {};
  if (a.done) return phead('<span>Заявка</span>', 'Заявка отправлена', '') + `<section class="sec" style="padding-top:40px"><div class="wrap"><div class="okbox" style="max-width:720px">
    <h3>Спасибо, ${esc(a.done.firstName)}!</h3><p style="color:var(--soft)">Заявка зарегистрирована. Ответственный менеджер свяжется с вами в ближайшее время. Чтобы ускорить ответ, можете написать нам в WhatsApp.</p>
    <div class="ctas" style="margin-top:20px"><a class="btn btn-red" href="${waLink(a.done.waText)}" target="_blank" rel="noopener">${ICON.wa} Написать в WhatsApp</a><a class="btn btn-ghost" href="#home" data-newapp>На главную</a></div></div></div></section>`;
  if (a.fallback) return phead('<span>Заявка</span>', 'Отправьте заявку в WhatsApp', '') + `<section class="sec" style="padding-top:40px"><div class="wrap"><div class="okbox" style="max-width:720px">
    <h3>${esc(a.firstName || '')}, заявка готова</h3><p style="color:var(--soft)">Нажмите кнопку — откроется WhatsApp с уже заполненным сообщением. Останется только нажать «Отправить», и менеджер свяжется с вами.</p>
    <pre style="white-space:pre-wrap;font:14px/1.5 var(--f-body);color:var(--soft);background:var(--ink-3);border:1px solid var(--line);border-radius:12px;padding:14px;margin:16px 0 0">${esc(a.fallback)}</pre>
    <div class="ctas" style="margin-top:20px"><a class="btn btn-red" href="${waLink(a.fallback)}" target="_blank" rel="noopener">${ICON.wa} Отправить в WhatsApp</a><button class="btn btn-ghost" data-backform>Изменить данные</button></div></div></div></section>`;
  const v = a.values || {};
  return phead('<span>Заявка</span>', 'Подать заявку', 'Заполните форму — заявка уйдёт нам в WhatsApp, менеджер бесплатно проконсультирует и подберёт программу.', a.page ? `<div class="demo-note" style="border-style:solid;background:rgba(196,38,46,.08);border-color:rgba(196,38,46,.4);color:var(--blush)">${esc(a.page)}</div>` : '') + `
  <section class="sec" style="padding-top:40px"><div class="wrap" style="max-width:900px">
    <form class="formbox" id="applyForm" novalidate>
      <fieldset><legend>Контактные данные</legend>
        <div class="grid3">
          <label for="a-fn" class="req">Имя<input id="a-fn" name="firstName" autocomplete="given-name" value="${esc(v.firstName)}" required></label>
          <label for="a-ln">Фамилия<input id="a-ln" name="lastName" autocomplete="family-name" value="${esc(v.lastName)}"></label>
          <label for="a-age">Возраст<input id="a-age" name="age" type="number" min="5" max="90" inputmode="numeric" value="${esc(v.age)}"></label>
        </div>
        <div class="grid2">
          <label for="a-country">Страна<input id="a-country" name="country" autocomplete="country-name" value="${esc(v.country ?? 'Казахстан')}"></label>
          <label for="a-city">Город<input id="a-city" name="city" autocomplete="address-level2" value="${esc(v.city)}"></label>
        </div>
        <div class="grid2">
          <label for="a-phone" class="req">Телефон<input id="a-phone" name="phone" type="tel" autocomplete="tel" placeholder="+7 7__ ___ __ __" value="${esc(v.phone)}" required></label>
          <label for="a-wa">WhatsApp<input id="a-wa" name="whatsapp" type="tel" placeholder="Если отличается от телефона" value="${esc(v.whatsapp)}"></label>
        </div>
        <div class="grid2">
          <label for="a-wechat">WeChat<input id="a-wechat" name="wechat" value="${esc(v.wechat)}"></label>
          <label for="a-email">Email<input id="a-email" name="email" type="email" autocomplete="email" value="${esc(v.email)}"></label>
        </div>
      </fieldset>
      <fieldset><legend>Что вас интересует</legend>
        <div class="grid2">
          <label for="a-dir" class="req">Направление<select id="a-dir" name="direction">${opt(DIRS, v.direction || a.dir || 'other')}</select></label>
          <label for="a-target">Город / университет / программа<input id="a-target" name="target" value="${esc(v.target ?? a.target ?? '')}" placeholder="Например, BLCU, Пекин"></label>
        </div>
        <label for="a-comment">Комментарий<textarea id="a-comment" name="comment" placeholder="Уровень языка, сроки, бюджет, вопросы">${esc(v.comment ?? a.comment ?? '')}</textarea></label>
        <label for="a-heard">Откуда вы о нас узнали<select id="a-heard" name="heard">${opt([['', 'Выберите'], ...HEARD.map(x => [x, x])], v.heard || '')}</select></label>
      </fieldset>
      <label for="a-ok" style="flex-direction:row;align-items:flex-start;gap:10px;font-weight:600;font-size:13.5px;color:var(--soft);letter-spacing:0"><input id="a-ok" name="consent" type="checkbox" style="width:18px;height:18px;margin-top:2px;flex-shrink:0;accent-color:var(--gold)" ${v.consent ? 'checked' : ''}> <span>Я согласен(на) на обработку персональных данных и принимаю <a href="#privacy" style="color:var(--gold-2)">политику конфиденциальности</a></span></label>
      <div class="ferr" id="ferr" role="alert"></div>
      <div class="ctas"><button class="btn btn-red" type="submit" id="sendBtn">${ICON.wa} Отправить заявку в WhatsApp</button><a class="btn btn-ghost" href="${waLink('Здравствуйте! Хочу получить консультацию Dragon Education.')}" target="_blank" rel="noopener">${ICON.wa} Получить консультацию</a></div>
    </form></div></section>`;
}
function leadText(L) {
  return ['Здравствуйте! Заявка с сайта Dragon Education.', 'Имя: ' + [L.firstName, L.lastName].filter(Boolean).join(' '), L.age && 'Возраст: ' + L.age,
    (L.country || L.city) && 'Откуда: ' + [L.city, L.country].filter(Boolean).join(', '), 'Телефон: ' + L.phone, L.whatsapp && 'WhatsApp: ' + L.whatsapp, L.wechat && 'WeChat: ' + L.wechat,
    L.email && 'Email: ' + L.email, 'Направление: ' + DIR[L.direction], L.target && 'Интересует: ' + L.target, L.comment && 'Комментарий: ' + L.comment].filter(Boolean).join('\n');
}
function submitApply(form) {
  const fd = Object.fromEntries(new FormData(form).entries());
  fd.consent = form.consent.checked;
  S.apply = Object.assign(S.apply || {}, { values: fd });
  const err = $('#ferr');
  if (!fd.firstName.trim()) { err.textContent = 'Укажите имя.'; form.firstName.focus(); return; }
  if (fd.phone.replace(/\D/g, '').length < 10) { err.textContent = 'Укажите телефон полностью, например +7 705 123 45 67.'; form.phone.focus(); return; }
  if (fd.email && !/^\S+@\S+\.\S+$/.test(fd.email)) { err.textContent = 'Проверьте адрес email.'; form.email.focus(); return; }
  if (!fd.consent) { err.textContent = 'Подтвердите согласие на обработку персональных данных.'; return; }
    const L = {
    id: 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    firstName: fd.firstName.trim(), lastName: fd.lastName.trim(), age: fd.age ? Number(fd.age) : null, country: fd.country.trim(), city: fd.city.trim(),
    phone: fd.phone.trim(), whatsapp: fd.whatsapp.trim(), wechat: fd.wechat.trim(), email: fd.email.trim(), direction: fd.direction, target: fd.target.trim(),
    comment: fd.comment.trim(), source: 'Сайт', heard: fd.heard || '', page: (S.apply && S.apply.page) || 'Форма заявки', createdAt: Date.now()
  };
  S.apply = Object.assign(S.apply, { fallback: leadText(L), firstName: L.firstName });
  try { window.open(waLink(leadText(L)), '_blank', 'noopener'); } catch (x) {}
  render(); scrollTo(0, 0);
}

/* ---------- Render & events ---------- */
const PAGES = { home: pHome, study: pStudy, program: pProgram, universities: pUnis, university: pUni, tours: pTours, tour: pTour, camps: pCamps, camp: pCamp,
  about: pAbout, blog: pBlog, post: pPost, faq: pFaq, contacts: pContacts, privacy: pPrivacy, terms: pTerms, apply: pApply };
let lastRoute = '';
function render() {
  const r = route();
  const key = r.page + '-' + r.id;
  const root = $('#app');
  const fn = PAGES[r.page] || notFound;
  root.innerHTML = header(r.page) + '<main>' + fn(r.id) + '</main>' + footer();
  if (key !== lastRoute) { scrollTo(0, 0); lastRoute = key; }
  document.title = 'Dragon Education';
}
window.addEventListener('hashchange', () => { S.menuOpen = false; render(); });

document.addEventListener('click', e => {
  const a = e.target.closest('a,button');
  if (!a) return;
  if (a.id === 'burger') { S.menuOpen = !S.menuOpen; render(); return; }
  if (a.dataset.copy) { e.preventDefault(); copyText(a.dataset.copy, a); return; }
  if (a.dataset.type !== undefined && a.getAttribute('href') === '#study') { S.study = { q: '', country: '', city: '', level: '', type: a.dataset.type, price: '' }; }
  if (a.hasAttribute('data-apply')) { S.apply = { dir: a.dataset.dir, target: a.dataset.target, page: a.dataset.page }; if (location.hash === '#apply') { e.preventDefault(); render(); } }
  if (a.dataset.book) {
    const sel = $('#dates .date-opt.on'); const i = sel ? +sel.dataset.i : 0;
    const item = a.dataset.book === 'tour' ? TOURS.find(t => t.title === a.dataset.title) : CAMPS.find(c => c.title === a.dataset.title);
    const d = item.dates[i];
    S.apply = { dir: a.dataset.book, target: a.dataset.title + (d.from === 'flex' ? '' : ', ' + fmtRange(d.from, d.to)), page: 'Бронирование — ' + a.dataset.page, comment: d.from === 'flex' ? 'Желаемые даты: ' : '' };
    if (location.hash === '#apply') { e.preventDefault(); render(); }
  }
  if (a.hasAttribute('data-newapp')) S.apply = null;
  if (a.hasAttribute('data-backform')) { delete S.apply.fallback; render(); return; }
  if (a.classList.contains('date-opt')) { $$('#dates .date-opt').forEach(b => b.classList.toggle('on', b === a)); return; }
  if (a.dataset.set) { const [k, f] = a.dataset.set.split('.'); S[k][f] = a.dataset.v; render(); return; }
  if (a.dataset.reset) { Object.keys(S[a.dataset.reset]).forEach(k => S[a.dataset.reset][k] = ''); render(); return; }
});
let fT;
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.f) return;
  const [k, f] = el.dataset.f.split('.'); S[k][f] = el.value;
  clearTimeout(fT);
  const id = el.id, pos = el.selectionStart;
  fT = setTimeout(() => { render(); const n = document.getElementById(id); if (n && n.tagName === 'INPUT') { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} } }, el.tagName === 'INPUT' ? 220 : 0);
});
document.addEventListener('submit', e => { if (e.target.id === 'applyForm') { e.preventDefault(); submitApply(e.target); } });

/* ---------- Story viewer ---------- */
const SV = { st: null, i: 0, timer: null, t0: 0, dur: 6000, paused: false };
function ytId(u) { try { const x = new URL(u); if (x.hostname.includes('youtu.be')) return x.pathname.slice(1); if (x.searchParams.get('v')) return x.searchParams.get('v'); const m = x.pathname.match(/\/(shorts|embed)\/([^/]+)/); return m ? m[2] : ''; } catch (e) { return u; } }
function svOpen(key) {
  SV.st = STORIES.find(s => s.key === key); if (!SV.st) return; SV.i = 0;
  let el = document.getElementById('sv');
  if (!el) { el = document.createElement('div'); el.id = 'sv'; el.className = 'sv'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); document.body.appendChild(el); }
  document.body.classList.add('sv-lock'); svRender();
}
function svClose() { clearInterval(SV.timer); const el = document.getElementById('sv'); if (el) el.remove(); document.body.classList.remove('sv-lock'); SV.st = null; }
function svGo(d) {
  const n = SV.i + d;
  if (n < 0) { SV.i = 0; svRender(); return; }
  if (n >= SV.st.items.length) { const k = STORIES.indexOf(SV.st); if (k < STORIES.length - 1) { SV.st = STORIES[k + 1]; SV.i = 0; svRender(); } else svClose(); return; }
  SV.i = n; svRender();
}
function svRender() {
  const st = SV.st, it = st.items[SV.i], el = document.getElementById('sv');
  let media = '';
  if (it.type === 'photo') media = `<span class="sv-fallback" aria-hidden="true">${esc(it.glyph || st.cover)}</span><img id="svActivePhoto" class="sv-photo" src="${it.url === 'HERO' ? HERO : esc(it.url)}" alt="${esc(it.alt || 'Фото истории')}" decoding="async" onerror="this.hidden=true">`;
  else if (it.type === 'youtube') media = `<iframe class="sv-yt" src="https://www.youtube.com/embed/${encodeURIComponent(ytId(it.url))}?autoplay=1&mute=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="Видео"></iframe>`;
  else media = `<div class="sv-card" style="background:linear-gradient(160deg,hsl(${it.hue} 55% 30%) 0%,hsl(${(it.hue + 25) % 360} 50% 16%) 60%,#0b0f12 100%)"><span class="sv-g">${esc(it.glyph)}</span></div>`;
  const text = `${it.title ? `<h3>${esc(it.title)}</h3>` : ''}${it.text ? `<p>${esc(it.text)}</p>` : ''}`;
  el.innerHTML = `<div class="sv-box">
    <div class="sv-bars">${st.items.map((_, i) => `<i><b style="width:${i < SV.i ? 100 : 0}%" ${i === SV.i ? 'id="svbar"' : ''}></b></i>`).join('')}</div>
    <div class="sv-head"><img src="${LOGO}" alt=""><b>${esc(st.label)}</b><small>dragonn_education</small><button class="sv-x" data-svx aria-label="Закрыть">×</button></div>
    <div class="sv-media">${media}</div>
    <button class="sv-nav sv-prev" data-svgo="-1" aria-label="Назад"></button><button class="sv-nav sv-next" data-svgo="1" aria-label="Дальше"></button>
    <div class="sv-cap">${it.illustrative ? '<span class="sv-photo-note">Иллюстративное фото · Unsplash</span>' : ''}${text}${it.cta ? `<a class="btn btn-red btn-sm" href="${esc(it.cta.href)}" ${it.cta.href.startsWith('http') ? 'target="_blank" rel="noopener"' : 'data-svlink'}>${esc(it.cta.label)}</a>` : ''}</div>
  </div>`;
  clearInterval(SV.timer);
  if (it.type === 'youtube') { const b = document.getElementById('svbar'); if (b) b.style.width = '100%'; return; }
  SV.t0 = Date.now();
  SV.timer = setInterval(() => {
    const activePhoto = document.getElementById('svActivePhoto');
    if (activePhoto && !activePhoto.complete && !activePhoto.hidden) { SV.t0 = Date.now(); return; }
    if (SV.paused) { SV.t0 += 100; return; }
    const p = Math.min(1, (Date.now() - SV.t0) / SV.dur); const b = document.getElementById('svbar'); if (b) b.style.width = p * 100 + '%';
    if (p >= 1) svGo(1);
  }, 100);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-story],[data-svx],[data-svgo],[data-svlink]');
  if (!b) { if (e.target.id === 'sv') svClose(); return; }
  if (b.dataset.story) svOpen(b.dataset.story);
  else if (b.hasAttribute('data-svx')) svClose();
  else if (b.dataset.svgo) svGo(+b.dataset.svgo);
  else if (b.hasAttribute('data-svlink')) svClose();
});
document.addEventListener('keydown', e => { if (!SV.st) return; if (e.key === 'Escape') svClose(); if (e.key === 'ArrowRight') svGo(1); if (e.key === 'ArrowLeft') svGo(-1); });
let svX = 0;
document.addEventListener('touchstart', e => { if (SV.st) { svX = e.changedTouches[0].screenX; SV.paused = true; } }, { passive: true });
document.addEventListener('touchend', e => { if (!SV.st) return; SV.paused = false; const dx = e.changedTouches[0].screenX - svX; if (Math.abs(dx) > 50) svGo(dx < 0 ? 1 : -1); }, { passive: true });

render();
</script>

</body></html>
